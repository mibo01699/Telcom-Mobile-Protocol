name: Telcom Mobile Protocol CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install Dependencies
      run: npm install bignumber.js express
    - name: Run Sovereign Security & Clearing Tests
      run: node TelcomProtocol.test.js
